name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'
      - run: dotnet build src/USBofon/USBofon.csproj -c Release
      - uses: actions/upload-artifact@v4
        with:
          name: USB-of_on
          path: src/USBofon/bin/Release/net48/USB-of_on.exe
      - if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: src/USBofon/bin/Release/net48/USB-of_on.exe
